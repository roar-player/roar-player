# Replaces the stock default.conf of the nginx image (see Dockerfile). Same as the stock server,
# except that the generated PDFs are served with Cache-Control: no-cache: they keep their names
# across deploys, so without it browsers heuristically cache them (10% of the Last-Modified age
# without revalidating) and keep showing outdated sheets after a deploy. no-cache still allows
# caching, but makes clients revalidate on every access — a cheap 304 while the file is unchanged.

server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    location ^~ /pdf {
        add_header Cache-Control "no-cache";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
    }
}
